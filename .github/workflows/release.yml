name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Validate version matches package.json
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.version }}) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Validate changelog has release entry
        run: |
          if ! grep -q "## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing entry for version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Compile
        run: bun run compile

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies

      # Registry publishing is intentionally DISABLED for this private fork.
      # We are an unannounced fork with no VS Code Marketplace / Open VSX
      # presence and no VSCE_PAT/OVSX_PAT secrets — these steps fail by design
      # (TF400813: not authorized) and previously killed the job before the
      # GitHub Release step ran, producing no artifact. They are left here
      # (commented) as the template to re-enable IF this fork ever gets its own
      # publisher identity + PATs. Until then the release is the attached .vsix.
      #
      # - name: Publish to VS Code Marketplace
      #   run: npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }} --no-dependencies
      #
      # - name: Publish to Open VSX
      #   run: npx ovsx publish *.vsix -p ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: "*.vsix"
          generate_release_notes: false
          body: |
            See [CHANGELOG.md](https://github.com/ludwig/vscode-beads-pm/blob/develop/CHANGELOG.md) for release notes.
          draft: false
